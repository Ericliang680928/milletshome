<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>查詢訂單｜米樂家食材</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../products/manfu-chili-sauce/assets/img/logo-mark.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 配色取自米樂家 logo：田地綠、日出橘／紅／黃、房子灰、田地紫、地線棕 */
:root{--cream:#FAF6EC;--cream2:#F1E9D6;--paper:#fff;--ink:#3A3633;--ink2:#6F675F;--charcoal:#454343;
--green:#7F9E44;--green-d:#5F7A30;--green-l:#E8EFD8;--orange:#EF8A2A;--red:#C63D1F;--red-d:#A83219;--yellow:#F3B329;--plum:#6E4763;--brown:#9C6B45;--line:#E6DDC9;
--serif:'Noto Serif TC','Songti TC',serif;--sans:'Noto Sans TC','Microsoft JhengHei','PingFang TC',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.7}
img{max-width:100%;display:block}
a{color:var(--green-d)}
h1,h2,h3{font-family:var(--serif);color:var(--charcoal);line-height:1.25;margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* 導覽 */
.nav{position:sticky;top:0;z-index:50;background:rgba(250,246,236,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nin{max-width:1120px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;gap:6px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--charcoal);font-family:var(--serif);font-weight:700;font-size:20px;margin-right:auto}
.brand img{height:44px;width:auto}
.nav .lk{color:var(--ink);text-decoration:none;padding:10px 12px;font-weight:500;font-size:16px;border-radius:999px}
.nav .lk:hover{background:var(--cream2)}
.cartbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--red);color:#fff;font-weight:700;cursor:pointer;text-decoration:none}
.cartbtn:hover{background:var(--red-d);color:#fff}
.cartbtn .n{background:#fff;color:var(--red);border-radius:999px;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;padding:0 6px}
@media(max-width:820px){.nav .lk{display:none}}

/* 按鈕 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 28px;border-radius:999px;font-weight:700;font-size:18px;border:2px solid transparent;cursor:pointer;text-decoration:none;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:var(--red-d);color:#fff}
.btn-line{background:#fff;color:var(--green-d);border-color:var(--green)}.btn-line:hover{background:var(--green-l)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:44px;padding:0 18px;font-size:16px}

/* Hero */
.hero{position:relative;overflow:hidden;padding:56px 0 72px}
.hero::before{content:"";position:absolute;right:-140px;top:-160px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#F6CF8D 0%,#F3B329 38%,rgba(239,138,42,.0) 70%);opacity:.55;pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.kicker{display:inline-flex;align-items:center;gap:10px;color:var(--green-d);font-weight:700;letter-spacing:.14em;font-size:14px}
.kicker::before{content:"";width:28px;height:3px;background:var(--orange);border-radius:2px}
.hero h1{font-size:clamp(40px,6.4vw,68px);font-weight:900;margin:14px 0 8px;letter-spacing:.02em}
.hero h1 em{font-style:normal;color:var(--red)}
.hero .lead{font-size:20px;color:var(--ink2);max-width:30em;margin:0 0 22px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:700;font-size:15px;color:var(--charcoal)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block}
.chip.o i{background:var(--orange)}.chip.r i{background:var(--red)}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.price-hero{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--red)}
.price-hero small{font-family:var(--sans);font-size:15px;font-weight:400;color:var(--ink2);margin-left:4px}
.heroimg{position:relative}
.heroimg img.main{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:28px;box-shadow:0 24px 50px -20px rgba(69,67,67,.45)}
.heroimg .stamp{position:absolute;left:-18px;bottom:28px;width:104px;height:104px;border-radius:50%;background:var(--green);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;line-height:1.2;text-align:center;box-shadow:0 8px 20px rgba(95,122,48,.4);transform:rotate(-8deg)}
.heroimg .stamp b{font-size:26px}.heroimg .stamp span{font-size:13px;letter-spacing:.08em}
@media(max-width:860px){.hero{padding:32px 0 48px}.hero .wrap{grid-template-columns:1fr;gap:28px}.heroimg{order:-1}.heroimg img.main{aspect-ratio:1/1}.heroimg .stamp{left:10px;bottom:-18px;width:90px;height:90px}}

/* 區塊 */
.sec{padding:72px 0}
.sec.alt{background:var(--paper)}
.sec.tint{background:var(--green-l)}
.sec h2{font-size:clamp(28px,4vw,40px);font-weight:900;text-align:center}
.sec .sub{text-align:center;color:var(--ink2);margin:10px auto 40px;max-width:36em}
.sec .lbl{display:block;text-align:center;color:var(--orange);font-weight:700;letter-spacing:.2em;font-size:13px;margin-bottom:8px}
@media(max-width:720px){.sec{padding:52px 0}}

/* 特色 */
.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.fcard{background:var(--cream);border-radius:20px;padding:26px 22px;border:1px solid var(--line)}
.fcard .ic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;color:#fff}
.fcard h3{font-size:21px;margin-bottom:6px}
.fcard p{margin:0;color:var(--ink2);font-size:15.5px;line-height:1.65}
@media(max-width:980px){.feat{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.feat{grid-template-columns:1fr}}

/* 果仁 */
.nuts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:0 0 34px}
.nut{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 20px;font-family:var(--serif);font-weight:700;font-size:18px;color:var(--charcoal)}
.nut:nth-child(3n+1){border-color:var(--green)}.nut:nth-child(3n+2){border-color:var(--orange)}.nut:nth-child(3n){border-color:var(--plum)}

/* 吃法 */
.eat{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.eat figure{margin:0;position:relative;border-radius:20px;overflow:hidden;background:var(--cream2)}
.eat img{width:100%;aspect-ratio:4/5;object-fit:cover;transition:transform .5s}
.eat figure:hover img{transform:scale(1.04)}
.eat figcaption{position:absolute;left:0;right:0;bottom:0;padding:44px 16px 14px;background:linear-gradient(to top,rgba(58,54,51,.78),rgba(58,54,51,0));color:#fff;font-family:var(--serif);font-weight:700;font-size:20px}
.also{text-align:center;margin-top:26px;color:var(--ink2)}
.also b{color:var(--red)}
@media(max-width:900px){.eat{grid-template-columns:repeat(2,1fr)}}

/* 規格 */
.spec{max-width:760px;margin:0 auto;background:var(--paper);border-radius:22px;border:1px solid var(--line);overflow:hidden}
.spec dl{margin:0}
.spec .r{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:16px 24px;border-bottom:1px solid var(--line)}
.spec .r:last-child{border-bottom:0}
.spec dt{font-weight:700;color:var(--green-d)}
.spec dd{margin:0}
.spec .warn{background:#FFF6E5;color:#7A4B00}
@media(max-width:520px){.spec .r{grid-template-columns:1fr;gap:2px;padding:14px 18px}}

/* 購買 */
.shop{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;align-items:start}
@media(max-width:980px){.shop{grid-template-columns:minmax(0,1fr)}}
.notice{background:#FFF6E5;border:1px solid #F0D9A8;color:#7A4B00;border-radius:14px;padding:12px 18px;margin:0 auto 24px;max-width:760px;text-align:center;font-weight:500}
.prod{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:18px;display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:24px;margin-bottom:18px}
.prod .pic{display:flex;flex-direction:column;gap:10px}
.prod .big{border-radius:16px;overflow:hidden;aspect-ratio:4/5;background:var(--cream2)}
.prod .big img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.thumbs button{flex:none;width:54px;height:54px;border-radius:10px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:none;opacity:.7}
.thumbs button.on{border-color:var(--orange);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover}
.prod h3{font-size:26px;font-weight:900}
.prod .psub{color:var(--ink2);margin:4px 0 10px}
.prod .pdesc{color:var(--ink2);font-size:15.5px;white-space:pre-line;margin:0 0 14px}
.prod .pr{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--red)}
.prod .pr small{font-family:var(--sans);font-size:15px;color:var(--ink2);font-weight:400}
.promo{display:inline-block;background:var(--green-l);color:var(--green-d);font-weight:700;border-radius:10px;padding:6px 12px;font-size:15px;margin:6px 0 12px}
.buyrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px}
.stepper{display:inline-flex;align-items:center;border:2px solid var(--line);border-radius:999px;background:#fff}
.stepper button{width:46px;height:46px;border:0;background:none;font-size:24px;cursor:pointer;color:var(--charcoal);border-radius:50%}
.stepper button:hover{background:var(--cream2)}
.stepper span{min-width:34px;text-align:center;font-weight:700}
.soldout{display:inline-block;background:var(--cream2);color:var(--ink2);border-radius:999px;padding:8px 18px;font-weight:700}
@media(max-width:640px){.prod{grid-template-columns:1fr}}
.cart{position:sticky;top:80px;background:var(--paper);border:2px solid var(--green);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:14px}
@media(max-width:980px){.cart{position:static}}
.cart h3{font-size:24px}
.crow{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.crow .nm{flex:1;min-width:0;font-weight:700;line-height:1.35}
.crow .nm small{display:block;font-weight:400;color:var(--ink2)}
.crow .free{color:var(--green-d);font-weight:700}
.crow .stepper button{width:38px;height:38px;font-size:20px}
.empty{background:var(--cream);border-radius:14px;padding:22px;text-align:center;color:var(--ink2)}
.sum{display:flex;flex-direction:column;gap:4px;font-size:16px}
.sum div{display:flex;justify-content:space-between}
.sum .tot{font-size:22px;font-weight:700;border-top:2px solid var(--line);padding-top:8px;margin-top:4px}
.sum .tot b{color:var(--red);font-family:var(--serif);font-size:28px}
.sum .hint{font-size:14px;color:var(--green-d);font-weight:500}
form.f{display:flex;flex-direction:column;gap:12px;border-top:2px solid var(--line);padding-top:16px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label,.fld .lb{font-size:14.5px;font-weight:700;color:var(--charcoal)}
.in{width:100%;min-height:50px;border:2px solid var(--line);border-radius:12px;padding:0 14px;background:#fff}
textarea.in{min-height:84px;padding:12px 14px;resize:vertical}
.in:focus{border-color:var(--green);outline:3px solid rgba(127,158,68,.3)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{position:relative;display:flex;align-items:center;justify-content:center;min-height:48px;border:2px solid var(--line);border-radius:12px;cursor:pointer;font-weight:700;text-align:center;padding:0 8px;background:#fff}
.seg input{position:absolute;opacity:0}
.seg input:checked+span{color:var(--green-d)}
.seg label:has(input:checked){border-color:var(--green);background:var(--green-l)}
.seg label:has(input:focus-visible){outline:3px solid var(--orange);outline-offset:2px}
.msg{border-radius:12px;padding:12px 14px;font-size:15px}
.bank{background:#FFF6E5;border:1.5px solid #F0D9A8;color:#5A3A00;border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.7;white-space:pre-line}
.bank b{display:block;color:var(--red-d);margin-bottom:2px}
.msg.err{background:#FBE9E4;color:#8A2B15;border:1px solid #F1C2B6}
.done{background:var(--green-l);border:2px solid var(--green);border-radius:18px;padding:20px;color:var(--green-d)}
.done b.no{font-size:22px;color:var(--charcoal);letter-spacing:.04em}
.odet{background:#fff;border:1px solid #CBDDA5;border-radius:12px;padding:12px 14px;margin:10px 0;color:var(--ink);font-size:15px;line-height:1.75;white-space:pre-line;word-break:break-all}
.copyrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.copyok{color:var(--green-d);font-weight:700;font-size:14px;align-self:center}
/* 查詢訂單 */
.lookup{max-width:720px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px}
.lookup form{display:flex;gap:10px;flex-wrap:wrap}
.lookup form .in{flex:1;min-width:200px}
.lres{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.lo{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.lo .lh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px}
.lo .lh b{font-size:17px;color:var(--charcoal)}
.lo .lh .tm{font-size:13px;color:var(--ink2)}
.lo .st{display:inline-block;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700;background:var(--cream2);color:var(--ink2)}
.lo .st.s0{background:#FBE0D8;color:#A83219}.lo .st.s1{background:#FFF0CC;color:#7A4B00}.lo .st.s2{background:#DDEAF7;color:#1F4F7C}.lo .st.s3{background:var(--green-l);color:var(--green-d)}
.lo .lb2{font-size:15px;color:var(--ink);white-space:pre-line;line-height:1.7}
.lo .tt{font-family:var(--serif);font-weight:700;color:var(--red);font-size:18px}
.fine{font-size:13.5px;color:var(--ink2);line-height:1.6}

/* 關於 */
.about{display:grid;grid-template-columns:260px 1fr;gap:44px;align-items:center;max-width:900px;margin:0 auto}
.about img{width:100%;max-width:260px;margin:0 auto}
.about h2{text-align:left}
.about p{color:var(--ink2);margin:14px 0}
.stores{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.stores span{background:#fff;border:1.5px solid var(--green);color:var(--green-d);border-radius:999px;padding:6px 16px;font-weight:700;font-size:15px}
@media(max-width:720px){.about{grid-template-columns:1fr;text-align:center;gap:20px}.about h2{text-align:center}.stores{justify-content:center}}

/* FAQ */
.faq{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.faq details{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:0 20px}
.faq summary{cursor:pointer;padding:16px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px;color:var(--charcoal)}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"＋";color:var(--orange);font-weight:900}
.faq details[open] summary::after{content:"－"}
.faq details p{margin:0 0 16px;color:var(--ink2)}

footer{background:var(--charcoal);color:#D8D2C8;padding:36px 20px;text-align:center;font-size:14.5px}
footer img{height:64px;margin:0 auto 12px;filter:drop-shadow(0 0 0 #fff)}
footer .bg{display:inline-block;background:var(--cream);border-radius:18px;padding:10px 18px;margin-bottom:14px}
footer .bg img{margin:0;height:56px}

/* 浮動購物車 */
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:60;width:62px;height:62px;border-radius:50%;border:0;background:var(--red);color:#fff;box-shadow:0 8px 22px rgba(168,50,25,.45);cursor:pointer;display:none;align-items:center;justify-content:center;padding:0}
.fab svg{width:28px;height:28px}
.fab .n{position:absolute;top:-4px;right:-4px;min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:var(--yellow);color:var(--charcoal);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
@media(max-width:980px){.fab.show{display:flex}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:70;background:var(--charcoal);color:#fff;border-radius:999px;padding:12px 22px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.eat figure:hover img{transform:none}}
</style>
</head>
<body>
<nav class="nav"><div class="nin">
  <a class="brand" href="../"><img src="../products/manfu-chili-sauce/assets/img/logo-mark.png" alt="">米樂家食材</a>
  <a class="lk" href="../">首頁</a><a class="lk" href="../products/">線上商店</a>
</div></nav>
<section class="sec tint" id="lookup" style="min-height:70vh"><div class="wrap">
  <span class="lbl">MY ORDERS</span><h2>查詢訂單</h2>
  <p class="sub">輸入下單時留的電話，查看訂單內容與目前狀態。</p>
  <div class="lookup">
    <form id="lkForm" novalidate><label class="sr" for="lk-tel">電話</label><input class="in" id="lk-tel" type="tel" inputmode="tel" placeholder="09xx-xxx-xxx" maxlength="20"><button class="btn btn-red" type="submit" id="lkBtn">查詢</button></form>
    <div class="msg err" id="lkErr" hidden style="margin-top:12px"></div>
    <div class="lres" id="lkRes"></div>
  </div>
</div></section>
<footer><div>米樂家食材 MILLET’S HOME・苗栗</div><div style="margin-top:8px"><a href="https://lin.ee/6xBvJta" target="_blank" rel="noopener" style="color:#fff;font-weight:700">💬 加入米樂家 LINE 官方帳號</a></div><div style="margin-top:6px;opacity:.8">© 2026 米樂家國際貿易有限公司</div></footer>
<script src="../config.js"></script>
<script>
let SET={bank:''};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n).toLocaleString('en-US');
mfGet('mf_settings?select=*').then(r=>r.forEach(x=>SET[x.key]=x.value)).catch(()=>{});
/* 訂單文字（給完成頁顯示、複製、查詢共用） */
const STI={'新訂單':0,'已確認':1,'已出貨':2,'已完成':3,'已取消':4};
const fmtTime=d=>new Date(d).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
function orderText(o,full){
  const L=['米樂家食材・滿福果仁辣醬 訂單','訂單編號：'+o.order_no,'下單時間：'+fmtTime(o.created_at)];
  if(o.status)L.push('訂單狀態：'+o.status);
  L.push('');
  o.items.forEach(i=>L.push('・'+i.name+'　NT$ '+money(i.price)+' × '+i.qty+' '+(i.unit||'')+(i.free?'（＋贈 '+i.free+' '+(i.unit||'')+'）':'')));
  L.push('商品小計：NT$ '+money(o.subtotal),'運費：'+(o.ship?'NT$ '+money(o.ship):'免運'),'合計：NT$ '+money(o.total),'');
  L.push('取貨方式：'+(o.delivery==='宅配'?'宅配到府':'門市自取（'+o.delivery+'）'));
  if(full&&o.addr)L.push('收件地址：'+o.addr);
  L.push('付款方式：'+o.pay);
  if(full&&o.name)L.push('收件人：'+o.name+'　'+o.tel);
  if(o.pay==='轉帳匯款')L.push('匯款帳號末 5 碼：'+(o.last5||'（尚未填寫）'));
  if(o.note)L.push('備註：'+o.note);
  if(o.pay==='轉帳匯款'&&SET.bank)L.push('','匯款資訊：'+SET.bank,o.last5?'':'匯款後請告知帳號末 5 碼');
  return L.join('\n');}
let LAST='';
async function copyText(t){try{await navigator.clipboard.writeText(t);return true;}catch(e){try{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok;}catch(_){return false;}}}
$('lkForm').addEventListener('submit',async e=>{e.preventDefault();const t=$('lk-tel').value.trim(),er=$('lkErr'),res=$('lkRes');er.hidden=true;res.innerHTML='';
  if(t.replace(/\D/g,'').length<8){er.textContent='請輸入完整電話號碼';er.hidden=false;return;}
  const b=$('lkBtn');b.disabled=true;b.textContent='查詢中…';
  try{const rows=await mfRpc('mf_lookup_orders',{tel_in:t});
    res.innerHTML=rows.length?rows.map(o=>'<div class="lo"><div class="lh"><div><b>'+esc(o.order_no)+'</b><div class="tm">'+esc(fmtTime(o.created_at))+'・'+esc(o.name||'')+'</div></div><span class="st s'+(STI[o.status]??4)+'">'+esc(o.status)+'</span></div><div class="lb2">'+esc(o.items.map(i=>i.name+' × '+i.qty+(i.free?'（＋贈 '+i.free+'）':'')).join('\n'))+'\n'+esc(o.delivery==='宅配'?'宅配到府':'門市自取（'+o.delivery+'）')+'・'+esc(o.pay)+'</div><div class="lh" style="margin:8px 0 0"><span class="tt">NT$ '+money(o.total)+'</span><button type="button" class="btn btn-line sm" data-copy="'+esc(o.order_no)+'">複製</button></div></div>').join('')
      :'<div class="empty">找不到這支電話的訂單，請確認號碼是否與下單時相同。</div>';
    res.querySelectorAll('[data-copy]').forEach(bt=>bt.onclick=async()=>{const o=rows.find(x=>x.order_no===bt.dataset.copy);const ok=await copyText(orderText(o,false));bt.textContent=ok?'已複製 ✓':'複製失敗';setTimeout(()=>bt.textContent='複製',2000);});
  }catch(err){er.textContent=/[\u4e00-\u9fff]/.test(err.message)?err.message:'查詢失敗，請稍後再試。';er.hidden=false;}
  b.disabled=false;b.textContent='查詢';});
