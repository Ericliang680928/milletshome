<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>線上商店｜米樂家食材</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="米樂家食材 Millet's Home">
<meta property="og:title" content="米樂家線上商店">
<meta property="og:description" content="米樂家自家產品線上訂購，宅配到府或門市自取。">
<meta property="og:image" content="https://ericliang680928.github.io/milletshome/products/manfu-chili-sauce/assets/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://ericliang680928.github.io/milletshome/products/">
<meta name="twitter:card" content="summary_large_image">

<meta name="description" content="米樂家食材自家產品線上訂購：滿福果仁辣醬等，宅配到府或門市自取。">
<link rel="icon" href="manfu-chili-sauce/assets/img/logo-mark.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--cream:#FAF6EC;--cream2:#F1E9D6;--ink:#3A3633;--ink2:#6F675F;--charcoal:#454343;--green:#7F9E44;--green-d:#5F7A30;--green-l:#E8EFD8;--orange:#EF8A2A;--red:#C63D1F;--red-d:#A83219;--line:#E6DDC9;--serif:'Noto Serif TC',serif}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.7 'Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif}
h1,h2,h3{font-family:var(--serif);color:var(--charcoal);margin:0;line-height:1.25}
a{color:var(--green-d)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.nav{position:sticky;top:0;z-index:50;background:rgba(250,246,236,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nin{max-width:1120px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;gap:6px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--charcoal);font-family:var(--serif);font-weight:700;font-size:20px;margin-right:auto}
.brand img{height:44px}
.nav .lk{color:var(--ink);text-decoration:none;padding:10px 12px;font-weight:500;border-radius:999px}
.nav .lk:hover{background:var(--cream2)}
.hero{padding:48px 0 24px}
.kicker{display:inline-flex;align-items:center;gap:10px;color:var(--green-d);font-weight:700;letter-spacing:.14em;font-size:14px}
.kicker::before{content:"";width:28px;height:3px;background:var(--orange);border-radius:2px}
.hero h1{font-size:clamp(32px,5vw,48px);font-weight:900;margin:10px 0 6px}
.hero p{color:var(--ink2);margin:0;max-width:36em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding:24px 0 72px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -14px rgba(69,67,67,.35)}
.card .th{position:relative;aspect-ratio:4/5;background:var(--cream2)}
.card .th img{width:100%;height:100%;object-fit:cover;display:block}
.card .tag{position:absolute;left:12px;top:12px;background:var(--red);color:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.card .bd{padding:16px 18px 20px;display:flex;flex-direction:column;gap:4px}
.card .nm{font-family:var(--serif);font-size:21px;font-weight:700;color:var(--charcoal)}
.card .sp{color:var(--ink2);font-size:14.5px}
.card .pr{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--red);margin-top:4px}
.card .pr small{font-family:inherit;font-size:14px;color:var(--ink2);font-weight:400}
.card .go{margin-top:10px;display:inline-flex;justify-content:center;align-items:center;min-height:44px;border-radius:999px;background:var(--red);color:#fff;font-weight:700}
.soon{border:2px dashed var(--green);background:var(--green-l);align-items:center;justify-content:center;min-height:320px;text-align:center;padding:24px;color:var(--green-d)}
.soon .e{font-size:44px}
footer{background:var(--charcoal);color:#D8D2C8;padding:32px 20px;text-align:center;font-size:14.5px}
footer a{color:#fff}
</style>
</head>
<body>
<nav class="nav"><div class="nin">
  <a class="brand" href="../"><img src="manfu-chili-sauce/assets/img/logo-mark.png" alt="">米樂家食材</a>
  <a class="lk" href="../">首頁</a><a class="lk" href="../order/">查詢訂單</a>
</div></nav>
<header class="hero"><div class="wrap">
  <span class="kicker">ONLINE SHOP</span>
  <h1>線上商店</h1>
  <p>米樂家自家開發的產品，線上下單，宅配到府或到苗栗三間門市自取。</p>
</div></header>
<main class="wrap"><div class="grid" id="grid"></div></main>
<footer>米樂家食材 MILLET’S HOME・苗栗<br><span style="opacity:.8">© 2026 米樂家國際貿易有限公司</span>　<a href="../order/">查詢訂單</a>　<a href="https://lin.ee/6xBvJta" target="_blank" rel="noopener">💬 LINE 官方帳號</a></footer>
<script>
/* 新產品：在 products/ 下加資料夾，再在這裡加一筆（首頁 index.html 的 PRODUCTS 也加一筆） */
const PRODUCTS=[
  {n:'滿福果仁辣醬',s:'純素・香麻小辣・淨重 250 公克',p:350,u:'罐',img:'manfu-chili-sauce/assets/img/jar-1.jpg',url:'manfu-chili-sauce/',promo:'買 5 送 1'}
];
document.getElementById('grid').innerHTML=PRODUCTS.map(p=>`<a class="card" href="${p.url}"><div class="th">${p.promo?`<span class="tag">${p.promo}</span>`:''}<img src="${p.img}" alt="${p.n}"></div><div class="bd"><div class="nm">${p.n}</div><div class="sp">${p.s}</div><div class="pr">NT$ ${p.p.toLocaleString()}<small>／${p.u}</small></div><span class="go">看商品・訂購</span></div></a>`).join('')
 +`<div class="card soon"><div><div class="e">🧺</div><div class="nm" style="margin-top:6px">更多產品陸續上架</div><div class="sp">想找批發品項？請洽米樂家門市</div></div></div>`;
</script>
</body>
</html>
